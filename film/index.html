<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seetal Film Maker v3 — cinema mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1216;--surface:#171c22;--surface2:#202832;--line:#2c3641;--text:#eaf0f6;--dim:#93a3b3;
 --green:#4caf50;--green-bg:#16241a;--red:#e57373;--blue:#64b5f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:21px;margin:0 0 2px;font-weight:800}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{font-family:"Azeret Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit;font-size:14.5px}
textarea{min-height:64px;resize:vertical}
button{font-family:inherit;font-size:14px;font-weight:700;padding:12px 16px;border-radius:10px;border:none;background:var(--surface2);color:var(--text);cursor:pointer}
button:hover:not(:disabled){background:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button.go{background:var(--green);color:#0b1a0b;width:100%;margin-top:10px}
.stage{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:9/16;max-height:58vh;margin:0 auto}
canvas{width:100%;height:100%;display:block}
.msg{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;display:none;white-space:pre-wrap}
.msg.show{display:block}
.msg.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.msg.bad{background:#2b1a1a;color:var(--red);border:1px solid var(--red)}
.msg.info{background:var(--surface2);color:var(--dim);border:1px dashed var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{flex:1;min-width:120px}
.shots{margin-top:10px;font-size:12.5px;color:var(--dim);max-height:120px;overflow:auto}
.shots div{padding:5px 0;border-bottom:1px dashed var(--line)}
.foot{color:var(--dim);font-size:12.5px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Seetal Film Maker <span style="font-size:12px;color:var(--dim);font-family:'Azeret Mono',monospace">v3</span></h1>
  <div class="sub">Cinema mode: har shot ka apna scene, do character, dialogue, camera move aur fade.</div>

  <div class="card">
    <label>Kahani (apni likh sakte ho)</label>
    <textarea id="topic" placeholder="jaise: jungle se darta hua ladka, gufa me ladki se milta hai, use bachata hai">Ek ladka jungle se darta hai. Aage jaakar use ek gufa milti hai. Wahan ek ladki milti hai. Woh usse bachata hai aur dosti ho jaati hai.</textarea>
    <div class="row">
      <div style="flex:1;min-width:110px"><label>Shots</label>
        <select id="nshots"><option>5</option><option selected>7</option><option>9</option><option>11</option></select></div>
      <div style="flex:1;min-width:110px"><label>Har shot</label>
        <select id="secs"><option value="3000">3 sec</option><option value="4000" selected>4 sec</option><option value="5000">5 sec</option></select></div>
    </div>
    <button class="go" id="make">1. Kahani + scenes banao</button>
    <div class="msg" id="msg1"></div>
    <div class="shots" id="shots"></div>
  </div>

  <div class="card">
    <div class="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
    <div class="row">
      <button id="play">2. Film chalao</button>
      <button id="rec">3. Record + download</button>
    </div>
    <div class="msg" id="msg2"></div>
  </div>

  <div class="foot">
    Scene, character aur dialogue Groq likhta hai (free). Drawing canvas par hoti hai — gufa, ped, nadi, do character, dialogue box, camera move aur fade. Awaaz phone ki TTS deti hai.
  </div>
</div>

<script>
const KSTORE="seetal-keys-v1";
const GROQ={base:"https://api.groq.com/openai/v1", model:"qwen/qwen3.8-27b"};
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const msg1=document.getElementById("msg1"), msg2=document.getElementById("msg2");
let shots=[], blobUrl=null, recorder=null, chunks=[], running=false, lastSnap=null;

function show(el,cls,txt){ el.className="msg show "+cls; el.textContent=txt; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function key(){ try{ const s=JSON.parse(localStorage.getItem(KSTORE)||"{}"); return (s.keys&&(s.keys.groq||s.keys.openrouter))||""; }catch(e){ return ""; } }
function parseJSON(t){
  t=String(t||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0&&b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}
async function askGroq(prompt){
  const k=key();
  if(!k) throw new Error("Groq key nahi mili — Simple Agent page par key save karo, phir yahan aao.");
  const r=await fetch(GROQ.base+"/chat/completions",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+k},
    body:JSON.stringify({model:GROQ.model,temperature:0.9,max_tokens:1800,
      messages:[{role:"system",content:"Tum film director ho. Bachchon aur badon ke liye saaf kahani likhte ho. Sirf JSON do."},{role:"user",content:prompt}]})});
  if(!r.ok) throw new Error("Groq HTTP "+r.status+" — "+(await r.text()).slice(0,110));
  const j=await r.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message.content)||"";
}

/* ---------- palettes ---------- */
const PAL={
  jungle:{sky:["#8fd3f4","#d7f5c8"],ground:"#2f7d32",hill:"#2b6b2f",prop:"🌴",night:false},
  cave:{sky:["#3b3b46","#6b6b78"],ground:"#4a4a55",hill:"#3a3a44",prop:"🕳️",night:true},
  river:{sky:["#9be7ff","#d9f7ff"],ground:"#1f7a8c",hill:"#2a8fa3",prop:"🌊",night:false},
  village:{sky:["#ffd89b","#ffb26b"],ground:"#8d6e63",hill:"#7a5c52",prop:"🏡",night:false},
  night:{sky:["#0b1030","#241a4d"],ground:"#22304a",hill:"#1a2438",prop:"🌙",night:true},
  room:{sky:["#f6d5b8","#ffe9d6"],ground:"#b98a5e",hill:"#c99b6e",prop:"🛋️",night:false}
};
const HEROES={"boy":"👦","girl":"👧","man":"🧑","woman":"👩","robot":"🤖","monkey":"🐒","elephant":"🐘","lion":"🦁","rabbit":"🐰","tiger":"🐯","child":"🧒","friend":"🧑"};
function mapHero(s){
  const t=String(s||"").toLowerCase();
  for(const k in HEROES) if(t.includes(k)) return HEROES[k];
  return "👦";
}
function mapScene(s){
  const t=String(s||"").toLowerCase();
  if(/cave|gufa|gufaa/.test(t)) return "cave";
  if(/river|nadi|water|jhar/.test(t)) return "river";
  if(/village|gaon|ghar/.test(t)) return "village";
  if(/night|raat|dark|andher/.test(t)) return "night";
  if(/room|kamra/.test(t)) return "room";
  return "jungle";
}

/* ---------- drawing ---------- */
function bg(scene,t){
  const p=PAL[scene]||PAL.jungle, W=cv.width, H=cv.height;
  const g=ctx.createLinearGradient(0,0,0,H*0.66);
  g.addColorStop(0,p.sky[0]); g.addColorStop(1,p.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // stars raat me
  if(p.night){
    ctx.fillStyle="rgba(255,255,255,.85)";
    for(let i=0;i<28;i++){
      const x=(i*97%W), y=(i*53%(H*0.5));
      const tw=0.5+0.5*Math.sin(t*6+i);
      ctx.globalAlpha=0.3+tw*0.7; ctx.fillRect(x,y,2.5,2.5);
    }
    ctx.globalAlpha=1;
  }else{
    ctx.font="76px serif"; ctx.textAlign="center";
    ctx.globalAlpha=0.95; ctx.fillText("☀️", W*0.82, H*0.14); ctx.globalAlpha=1;
  }

  // clouds
  ctx.font="72px serif"; ctx.textAlign="center"; ctx.globalAlpha=0.9;
  for(let i=0;i<3;i++){
    const x=((t*0.3 + i*0.42)%1.3-0.15)*W;
    ctx.fillText(p.night?"☁️":"☁️", x, H*(0.12+i*0.075));
  }
  ctx.globalAlpha=1;

  // hills
  ctx.fillStyle=p.hill;
  ctx.beginPath(); ctx.ellipse(W*0.25,H*0.66,W*0.5,H*0.11,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W*0.85,H*0.66,W*0.45,H*0.09,0,0,Math.PI*2); ctx.fill();

  // ground
  ctx.fillStyle=p.ground; ctx.fillRect(0,H*0.66,W,H*0.34);

  // cave ka arch
  if(scene==="cave"){
    ctx.fillStyle="#14161c";
    ctx.beginPath();
    ctx.moveTo(W*0.30,H*0.66);
    ctx.quadraticCurveTo(W*0.30,H*0.34,W*0.50,H*0.34);
    ctx.quadraticCurveTo(W*0.70,H*0.34,W*0.70,H*0.66);
    ctx.closePath(); ctx.fill();
    // andar halki roshni
    const rg=ctx.createRadialGradient(W*0.5,H*0.60,10,W*0.5,H*0.60,W*0.22);
    rg.addColorStop(0,"rgba(255,200,90,.35)"); rg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(W*0.5,H*0.60,W*0.22,0,Math.PI*2); ctx.fill();
  }

  // ped / props
  ctx.font="84px serif"; ctx.textAlign="center";
  for(let i=0;i<5;i++){
    const x=((i*0.23 - t*0.05 + 1)%1)*W;
    ctx.fillText(p.prop, x, H*0.68 + (i%2)*8);
  }
  // ghaas
  ctx.fillStyle="rgba(255,255,255,.12)";
  for(let i=0;i<26;i++){ const gx=(i*0.041*W + t*10)%W; ctx.fillRect(gx,H*0.66+8+(i%3)*20,3,11); }
}

function character(emoji, x, y, scale, t, flip){
  ctx.save();
  ctx.translate(x,y);
  if(flip) ctx.scale(-1,1);
  const bob=Math.sin(t*Math.PI*6)*10;
  ctx.font=Math.round(scale)+"px serif"; ctx.textAlign="center";
  ctx.fillStyle="rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.ellipse(0, 34, scale*0.32, scale*0.09, 0,0,Math.PI*2); ctx.fill();
  ctx.fillText(emoji, 0, bob);
  ctx.restore();
}

function dialogue(name, line, bottomGap){
  const W=cv.width;
  ctx.font="700 30px Manrope, sans-serif"; ctx.textAlign="left";
  const lines=wrap(line, W-120, ctx);
  const h=lines.length*38+58;
  const y=cv.height-h-(bottomGap||92);
  ctx.fillStyle="rgba(10,14,20,.82)";
  roundRect(28,y,W-56,h,18); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=2; roundRect(28,y,W-56,h,18); ctx.stroke();
  ctx.fillStyle="#4caf50"; ctx.font="800 22px Manrope, sans-serif";
  ctx.fillText(String(name||"").toUpperCase(), 52, y+34);
  ctx.fillStyle="#fff"; ctx.font="600 30px Manrope, sans-serif";
  let yy=y+72; lines.forEach(l=>{ ctx.fillText(l, 52, yy); yy+=38; });
}
function subtitle(text){
  const W=cv.width;
  ctx.font="800 38px Manrope, sans-serif"; ctx.textAlign="center";
  const lines=wrap(text, W-80, ctx);
  const lh=46, h=lines.length*lh+30;
  subtitle.lastH=h;
  ctx.fillStyle="rgba(0,0,0,.55)"; roundRect(30, cv.height-h-26, W-60, h, 14); ctx.fill();
  ctx.fillStyle="#fff";
  let y=cv.height-h-26+40;
  lines.forEach(l=>{ ctx.fillText(l, W/2, y); y+=lh; });
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function wrap(text,maxW,c){
  const words=String(text||"").split(/\s+/); const out=[]; let cur="";
  words.forEach(w=>{ const t=cur?cur+" "+w:w; if(c.measureText(t).width>maxW&&cur){out.push(cur);cur=w;} else cur=t; });
  if(cur) out.push(cur); return out;
}

function drawShot(idx, t){
  const s=shots[idx]||{};
  const W=cv.width, H=cv.height;
  const zoom=1+0.05*t, dx=(t-0.5)*18;
  ctx.save();
  ctx.translate(W/2,H/2); ctx.scale(zoom,zoom); ctx.translate(-W/2,-H/2);
  bg(s.scene||"jungle", t);
  const hero=s.hero||"👦";
  const partner=s.partner||"";
  // andhere me character dikhe — halka glow
  if(PAL[s.scene] && PAL[s.scene].night){
    ctx.fillStyle="rgba(255,235,180,.10)";
    ctx.beginPath(); ctx.ellipse(W*0.5, H*0.66, W*0.42, H*0.13, 0,0,Math.PI*2); ctx.fill();
  }
  character(hero, W*(0.33+dx/W), H*0.715, 155, t, false);
  if(partner) character(partner, W*(0.67+dx/W), H*0.715, 155, t+0.4, true);
  ctx.restore();

  subtitle.lastH=0;
  if(s.text) subtitle(s.text);
  if(s.say) dialogue(s.speaker||"", s.say, (subtitle.lastH||0)+34);

  // progress
  ctx.fillStyle="rgba(255,255,255,.22)"; ctx.fillRect(0,H-8,W,8);
  ctx.fillStyle="#4caf50"; ctx.fillRect(0,H-8,W*((idx+t)/shots.length),8);
}

/* ---------- story ---------- */
document.getElementById("make").onclick=async ()=>{
  const story=document.getElementById("topic").value.trim();
  if(!story){ show(msg1,"bad","Pehle kahani likho."); return; }
  const n=document.getElementById("nshots").value;
  show(msg1,"info","Director soch raha hai…");
  try{
    const raw=await askGroq(`Kahani: "${story}"
Ise ${n} shots me todo (Hinglish, bachche bhi samajh lein).
Har shot ka JSON:
{"text":"subtitle 6-8 shabd","say":"dialogue / voice-over ek line","speaker":"kaun bol raha hai (Boy/Girl/Narrator)",
 "scene":"jungle|cave|river|village|night|room","hero":"boy|girl|man|woman|robot|monkey|tiger|rabbit","partner":"boy|girl|man|woman|(khaali)"}
Dhyan rakho: scene badalta rahe, dono character dikhein jahan zaroori ho, aur kahani ka flow ho (darr -> gufa -> ladki -> bachaya -> dosti).
Sirf JSON: {"title":"...","shots":[...]}`);
    const data=parseJSON(raw);
    shots=(data.shots||[]).map((s,i)=>({
      text:s.text||"", say:s.say||"", speaker:s.speaker||"",
      scene:mapScene(s.scene+" "+(s.text||"")), hero:mapHero(s.hero||"boy"),
      partner:(s.partner && String(s.partner).trim() && String(s.partner).toLowerCase()!=="khaali")?mapHero(s.partner):""
    }));
    if(!shots.length) throw new Error("kahani khaali aayi");
    document.getElementById("shots").innerHTML=shots.map((s,i)=>
      `<div><b>${i+1}.</b> ${esc(s.text)} <span style="opacity:.6">· ${esc(s.say)}</span></div>`).join("");
    show(msg1,"ok",shots.length+" scenes taiyar. Ab 'Film chalao' dabao.");
    drawShot(0,0.4);
  }catch(e){ show(msg1,"bad","Ruk gaya: "+e.message); }
};

/* ---------- playback ---------- */
function snapshot(){ try{ lastSnap=document.createElement("canvas"); lastSnap.width=cv.width; lastSnap.height=cv.height;
  lastSnap.getContext("2d").drawImage(cv,0,0); }catch(e){ lastSnap=null; } }

async function playFilm(record){
  if(!shots.length){ show(msg2,"bad","Pehle step 1 dabao."); return; }
  if(running) return; running=true;
  const per=parseInt(document.getElementById("secs").value,10);

  if(record){
    const stream=cv.captureStream(30);
    const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":"video/webm";
    chunks=[]; recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000});
    recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:"video/webm"});
      if(blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=blobUrl; a.download="seetal-film-"+Date.now()+".webm";
      document.body.appendChild(a); a.click(); a.remove();
      show(msg2,"ok","Video ban gayi — "+(blob.size/1048576).toFixed(2)+" MB download ho rahi hai.");
    };
    recorder.start(400);
    show(msg2,"info","Record ho raha hai…");
  }else show(msg2,"info","Film chal rahi hai…");

  await card(1500, "🎬", "Seetal Film");

  for(let i=0;i<shots.length;i++){
    const s=shots[i];
    if(s.say && window.speechSynthesis){
      try{ const u=new SpeechSynthesisUtterance(s.say); u.lang="hi-IN"; u.rate=0.92; speechSynthesis.speak(u); }catch(e){}
    }
    await new Promise(res=>{
      const t0=performance.now();
      (function loop(){
        const t=Math.min(1,(performance.now()-t0)/per);
        drawShot(i,t);
        if(t<0.18 && lastSnap){ ctx.globalAlpha=1-(t/0.18); ctx.drawImage(lastSnap,0,0); ctx.globalAlpha=1; }
        if(t<1) requestAnimationFrame(loop); else { snapshot(); res(); }
      })();
    });
  }
  await card(1600, "🌟", "Kahani poori hui");

  if(record && recorder && recorder.state!=="inactive") recorder.stop();
  running=false;
  if(!record) show(msg2,"ok","Film poori chali — ab record dabao to video file banegi.");
}

function card(ms, emoji, text){
  return new Promise(res=>{
    const t0=performance.now();
    (function loop(){
      const t=Math.min(1,(performance.now()-t0)/ms);
      const g=ctx.createLinearGradient(0,0,0,cv.height);
      g.addColorStop(0,"#101a24"); g.addColorStop(1,"#070b10");
      ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.textAlign="center";
      ctx.globalAlpha=Math.min(1,t*2.5);
      ctx.font="120px serif"; ctx.fillText(emoji, cv.width/2, cv.height/2-40);
      ctx.fillStyle="#eaf0f6"; ctx.font="800 44px Manrope, sans-serif";
      ctx.fillText(text, cv.width/2, cv.height/2+60);
      ctx.globalAlpha=1;
      if(t<1) requestAnimationFrame(loop); else res();
    })();
  });
}

document.getElementById("play").onclick=()=>playFilm(false);
document.getElementById("rec").onclick=()=>playFilm(true);
bg("jungle",0.3);
</script>
</body>
</html>
