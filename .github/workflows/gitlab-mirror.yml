name: GitLab mirror (backup)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLab par bhejo
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_REPO }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret nahi mila — GitHub Settings > Secrets me daalo"; exit 1
          fi
          REPO="${GITLAB_REPO:-gitlab.com/Bhuprndar785/bhupendarsingh785.git}"
          case "$REPO" in
            http*) URL="$REPO" ;;
            *) URL="https://oauth2:${GITLAB_TOKEN}@${REPO}" ;;
          esac
          git config user.name "seetal-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add gitlab "$URL" || git remote set-url gitlab "$URL"
          echo "mirror -> $REPO"
          # 1) normal push
          if git push gitlab HEAD:refs/heads/main; then
            echo "ho gaya (main): $REPO"
          # 2) force push (GitLab me "Allowed to force push" ON ho to chalega)
          elif git push gitlab HEAD:refs/heads/main --force; then
            echo "ho gaya (main, force): $REPO"
          # 3) warna alag branch par safe backup
          else
            echo "main par push nahi hua — mirror branch par bhej raha hoon"
            git push gitlab HEAD:refs/heads/mirror --force
            echo "ho gaya (mirror branch): $REPO"
          fi

      - name: Doosra GitLab project (Seetal) — optional
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_2: ${{ vars.GITLAB_REPO_2 }}
        run: |
          if [ -n "$GITLAB_REPO_2" ]; then
            CANDS="$GITLAB_REPO_2"
          else
            CANDS="gitlab.com/Bhuprndar785/seetal.git gitlab.com/Bhuprndar785/Seetal.git gitlab.com/bhupendarsingh/seetal.git gitlab.com/bhupendra-singh/seetal.git"
          fi
          for R in $CANDS; do
            U="https://oauth2:${GITLAB_TOKEN}@${R}"
            git remote remove g2 2>/dev/null || true
            git remote add g2 "$U"
            echo "try -> $R"
            if git push g2 HEAD:refs/heads/main --force 2>&1 | tee /tmp/out.txt; then
              if grep -qi "rejected\|error\|fatal\|Could not create" /tmp/out.txt; then
                echo "nahi chala: $R"
              else
                echo "HO GAYA (seetal): $R"; break
              fi
            else
              echo "nahi chala: $R"
            fi
          done
