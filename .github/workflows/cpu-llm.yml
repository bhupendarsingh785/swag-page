name: CPU LLM test (bina GPU, bina key)

on:
  push:
    paths:
      - "prompts/**.txt"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: models
          key: qwen15b-gguf-v1

      - name: Install (CPU wheel)
        run: |
          pip install --upgrade pip
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip install huggingface_hub

      - name: Chalao
        run: |
          shopt -s nullglob
          files=(prompts/*.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "prompt nahi mila"; exit 0; fi
          for f in "${files[@]}"; do
            echo "== $f"
            python tools/cpu_llm.py "$(cat "$f")"
          done
